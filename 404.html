<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مستخبي</title>
  <script>
    // GitHub Pages لا يدعم أي رواتينج من جانب السيرفر — أي مسار غير
    // موجود كملف فعلي (زي /mohamednasrofficial) بيوصل هنا تلقائياً.
    // بنمرّر اسم المستخدم عن طريق query param بدل sessionStorage
    // (أكثر ثباتاً مع متصفحات السوشيال ميديا الداخلية اللي أحياناً
    // بتقيّد الوصول لـ sessionStorage بين عمليات التنقل).
    // index.html بيقرأ الـ param ده، يرجّع الرابط النظيف تاني في
    // شريط العنوان، ويفتح صفحة إرسال الرسالة لصاحب اليوزرنيم مباشرة.
    var username = location.pathname.replace(/^\//, '').split('/')[0];
    if (username && username !== 'index.html') {
      location.replace('/?__mstkhby_user=' + encodeURIComponent(username));
    } else {
      location.replace('/');
    }
  </script>
</head>
<body>
  <p>جارِ التحويل...</p>
</body>
</html>
